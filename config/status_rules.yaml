# Portfolio status rules (problem_statement.md §4), evaluated in code by app/scorecard/status.py.
#
# Order: Red is checked first, then Green, otherwise Amber. (The two conditions cannot both
# hold, so the order only makes the rule easy to read.) If adoption or ROI is not available
# the status is "Insufficient data" with the reason; it is never guessed.
#
# Ratios, not percentages: 0.60 means 60%.
red_if_any:
  adoption_below: 0.30
  roi_below: 0.0
green_if_all:
  adoption_at_least: 0.60
  roi_above: 0.0

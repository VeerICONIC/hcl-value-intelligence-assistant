# Labelled evaluation questions. expect_route / expect_status are checked exactly;
# must_contain: every string must appear in the answer (case-insensitive); must_not_contain: none may appear.
- id: Q01
  type: metric
  question: What is the ROI of the Customer Service Chatbot?
  expect_route: metric
  expect_status: answered
  must_contain: ["-25.0%", "Red"]
- id: Q02
  type: metric
  question: Which initiative has the highest adoption?
  expect_route: metric
  expect_status: answered
  must_contain: ["HR Policy Copilot", "72.0%"]
- id: Q03
  type: metric
  question: How many initiatives are red?
  expect_route: metric
  expect_status: answered
  must_contain: ["3 initiative(s) are Red"]
- id: Q04
  type: metric
  question: Show payback for INIT-008
  expect_route: metric
  expect_status: answered
  must_contain: ["Not reached"]
- id: Q05
  type: narrative
  question: What are the risks of the Contract Review Assistant?
  expect_route: narrative
  expect_status: answered
  must_contain: ["senior lawyers"]
  expect_source_section: Risks and Mitigations
- id: Q06
